server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: smart-ticket-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smart_ticket?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 5000
      validation-timeout: 3000
  sql:
    init:
      mode: never
  ai:
    model:
      chat: ${AI_CHAT_MODEL:none}
    openai:
      # Placeholder keeps Spring AI beans constructible while app.ai.enabled=false; never use it for real calls.
      api-key: ${AI_API_KEY:disabled}
      base-url: ${AI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}
          temperature: ${AI_TEMPERATURE:0.0}
          max-completion-tokens: ${AI_MAX_COMPLETION_TOKENS:300}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: 3600

app:
  ai:
    enabled: ${AI_ENABLED:false}
    timeout: ${AI_TIMEOUT:15s}

